[package]
name = "ymusic"
version = "0.1.0"
description = "A sleek, native Yandex Music desktop client in Rust"
authors = ["tbesa"]
edition = "2021"

[lib]
name = "ymusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
md-5 = "0.10"
dirs = "5"
regex = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "unwind"
strip = false
